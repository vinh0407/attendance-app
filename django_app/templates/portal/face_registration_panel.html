<section class="panel face-registration-panel" id="face-registration">
  <div class="panel-head"><div><p class="eyebrow">FACE REGISTRATION</p><h2>Register a student face</h2><p class="muted">Add a face profile directly from the admin workspace. The same profile is used by the attendance kiosk.</p></div><span id="adminEngineStatus" class="status">Checking engine</span></div>
  <form id="adminFaceForm" class="admin-face-form" onsubmit="submitAdminFace(event)">
    <div class="form-grid"><label class="field"><span>Student ID <b>*</b></span><input id="adminStudentId" required placeholder="2251120064"></label><label class="field"><span>Full name <b>*</b></span><input id="adminFullName" required placeholder="Nguyen Van A"></label><label class="field"><span>Class</span><input id="adminClassName" list="adminClassOptions" placeholder="Class ID or name"><datalist id="adminClassOptions">{% for classroom in classrooms %}<option value="{{ classroom.class_id }}">{{ classroom.name }}</option>{% endfor %}</datalist></label><label class="field"><span>Email</span><input id="adminEmail" type="email" placeholder="student@uth.edu.vn"></label></div>
    <div class="admin-face-actions"><label class="button button-secondary upload-button">Upload face image<input id="adminFaceFile" type="file" accept="image/*" hidden></label><button class="button button-secondary" type="button" id="adminCameraButton" onclick="toggleAdminCamera()">Use camera</button><button class="button button-primary" type="submit" id="adminRegisterButton" disabled>Register face</button></div>
    <div id="adminCameraWrap" class="admin-camera-wrap hidden"><video id="adminCamera" autoplay playsinline></video><button type="button" class="button button-secondary" onclick="captureAdminFace()">Capture image</button><canvas id="adminCanvas" hidden></canvas></div><div id="adminFacePreview" class="image-strip"></div><p id="adminFaceResult" class="field-hint">Add one clear image to enable registration.</p>
  </form>
</section>
<script>
let adminFaceImages=[],adminCameraStream=null;
function updateAdminFaceButton(){document.getElementById('adminRegisterButton').disabled=!(document.getElementById('adminStudentId').value.trim()&&document.getElementById('adminFullName').value.trim()&&adminFaceImages.length);}
function renderAdminFacePreview(){const box=document.getElementById('adminFacePreview');box.innerHTML='';adminFaceImages.forEach((src,i)=>{const item=document.createElement('div');item.className='image-thumb';item.innerHTML='<img src="'+src+'" alt="Face image '+(i+1)+'"><button type="button" onclick="adminFaceImages.splice('+i+',1);renderAdminFacePreview();updateAdminFaceButton()">×</button>';box.appendChild(item);});updateAdminFaceButton();}
document.addEventListener('DOMContentLoaded',()=>{['adminStudentId','adminFullName','adminClassName','adminEmail'].forEach(id=>document.getElementById(id).addEventListener('input',updateAdminFaceButton));document.getElementById('adminFaceFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=event=>{adminFaceImages=[event.target.result];renderAdminFacePreview();};reader.readAsDataURL(file);});fetch('/api/face-engine/status/').then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{const s=document.getElementById('adminEngineStatus');s.textContent=ok&&d.data?.available?'Engine ready':'Engine unavailable';s.classList.add(ok?'status-present':'status-absent');});});
async function toggleAdminCamera(){const wrap=document.getElementById('adminCameraWrap');if(adminCameraStream){adminCameraStream.getTracks().forEach(t=>t.stop());adminCameraStream=null;wrap.classList.add('hidden');document.getElementById('adminCameraButton').textContent='Use camera';return;}try{adminCameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('adminCamera').srcObject=adminCameraStream;wrap.classList.remove('hidden');document.getElementById('adminCameraButton').textContent='Close camera';}catch(e){document.getElementById('adminFaceResult').textContent='Camera unavailable. Upload an image instead.';}}
function captureAdminFace(){const video=document.getElementById('adminCamera'),canvas=document.getElementById('adminCanvas');if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);adminFaceImages=[canvas.toDataURL('image/jpeg',.9)];renderAdminFacePreview();}
async function submitAdminFace(event){event.preventDefault();const button=document.getElementById('adminRegisterButton');button.disabled=true;button.textContent='Saving...';try{const response=await fetch('/api/register-face/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:document.getElementById('adminStudentId').value.trim(),name:document.getElementById('adminFullName').value.trim(),class_name:document.getElementById('adminClassName').value.trim(),email:document.getElementById('adminEmail').value.trim(),images:adminFaceImages})});const data=await response.json();const result=document.getElementById('adminFaceResult');result.textContent=data.success?'Registration complete. '+data.data.faces_registered+' image(s) saved.':'Registration failed: '+(data.error||'Unknown error');result.className='field-hint '+(data.success?'positive':'danger-text');if(data.success){document.getElementById('adminFaceForm').reset();adminFaceImages=[];renderAdminFacePreview();}}catch(error){document.getElementById('adminFaceResult').textContent='Could not reach the server.';}button.textContent='Register face';updateAdminFaceButton();}
</script>
